<div class="login-container">
  <h2>Login</h2>
  <form (ngSubmit)="onLogin()">
    <input
      type="text"
      [(ngModel)]="username"
      name="username"
      placeholder="Username"
      required>
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Password"
        required>
        <button type="submit" [disabled]="loading">
          {{loading ? 'Logging in...' : 'Login'}}
        </button>
      </form>
      @if (error) {
        <div class="error">{{error}}</div>
      }
    </div>
