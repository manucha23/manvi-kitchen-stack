<div class="order-list-page bg-surface-50 dark:bg-surface-950 transition-colors duration-300">
  <!-- Header Section -->
  <div class="order-list-page__header mb-6 md:mb-8 animate-fade-in">
    <div class="flex-1 min-w-0">
      <div class="flex items-center justify-between gap-3">
        <h1 class="text-[18px] font-extrabold text-surface-900 dark:text-surface-0 tracking-tight m-0">Orders</h1>
        <p-button label="Create Order" icon="pi pi-plus" (click)="showCreatePopup.set(true)" severity="primary"
          rounded="true" styleClass="text-[16px]" class="shrink-0 transition-shadow duration-300" />
      </div>
      <p class="text-[16px] text-surface-500 dark:text-surface-400 mt-1">Manage and track your kitchen workflow</p>
    </div>
  </div>

  @if (selectionMode()) {
  <app-order-bulk-operations class="mb-4 lg:mb-6" [selectedOrders]="selectedOrdersList()"
    [visibleCount]="orders().length" [statusOptions]="statusOptions" (clearSelection)="clearSelection()"
    (selectAll)="selectAllVisibleOrders()" (bulkUpdated)="loadOrders()" />
  } @else {
  <app-order-list-filters [collapsedOnMobile]="true" (filtersChange)="onFiltersChange($event)" />
  }

  <app-order-list-mobile [orders]="orders()" [loading]="loading()" [hasMore]="hasMore()"
    [statusOptions]="statusOptions" [loadingPlaceholders]="loadingPlaceholders"
    [selectionMode]="selectionMode()" [selectedOrderIds]="selectedOrderIds()"
    (auditClick)="openOrderHistory($event.orderId, $event.event)"
    (statusChange)="updateOrderStatus($event.orderId, $event.status)"
    (selectionToggle)="toggleOrderSelection($event)" (loadMoreRequest)="loadMore()" />

  <app-order-list-desktop [orders]="orders()" [tableRows]="tableRows()" [loading]="loading()" [hasMore]="hasMore()"
    [statusOptions]="statusOptions" [sortField]="sortField" [sortOrder]="sortOrder"
    [selectionMode]="selectionMode()" [selectedOrderIds]="selectedOrderIds()"
    (auditClick)="openOrderHistory($event.orderId, $event.event)"
    (statusChange)="updateOrderStatus($event.orderId, $event.status)"
    (selectionToggle)="toggleOrderSelection($event)" (selectAllToggle)="selectAllVisibleOrders()"
    (clearSelection)="clearSelection()" (sortChange)="onTableSort($event)" (loadMoreRequest)="loadMore()" />

  @if(showCreatePopup()) {
  <app-order-create [isVisible]="showCreatePopup()" (orderCreated)="onOrderCreated()"
    (closePopup)="showCreatePopup.set(false)">
  </app-order-create>
  }

  <app-order-history [orderId]="selectedOrderId()" [visible]="showHistoryPopup()"
    (closed)="closeHistoryPopup()" />
</div>
