name: Destroy CDK Stack

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        type: choice
        options:
          - test
          - prod
      stack_name:
        description: 'Stack name to destroy (leave empty for all stacks)'
        required: false
        type: string
      confirmation:
        description: 'Type the environment name again to confirm destruction'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  validate-confirmation:
    runs-on: ubuntu-latest
    outputs:
      confirmed: ${{ steps.check.outputs.confirmed }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.event.inputs.confirmation }}" == "${{ github.event.inputs.environment }}" ]]; then
            echo "confirmed=true" >> $GITHUB_OUTPUT
            echo "✅ Confirmation validated"
          else
            echo "confirmed=false" >> $GITHUB_OUTPUT
            echo "❌ Confirmation failed. You must type '${{ github.event.inputs.environment }}' to confirm."
            exit 1
          fi

  destroy:
    needs: [validate-confirmation]
    if: needs.validate-confirmation.outputs.confirmed == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Download CDK artifacts
        uses: actions/download-artifact@v4
        with:
          name: cdk-artifacts
          path: cdk.out/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: List stacks before destruction
        run: |
          echo "📋 Current stacks in ${{ github.event.inputs.environment }}:"
          npx cdk list
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: Destroy CDK stack
        run: |
          export CDK_DEFAULT_ACCOUNT=${{ secrets.AWS_ACCOUNT_ID }}
          export CDK_DEFAULT_REGION=${{ secrets.AWS_REGION }}
          
          if [[ -n "${{ github.event.inputs.stack_name }}" ]]; then
            echo "🗑️ Destroying specific stack: ${{ github.event.inputs.stack_name }}"
            npx cdk destroy ${{ github.event.inputs.stack_name }} --force
          else
            echo "🗑️ Destroying all stacks in ${{ github.event.inputs.environment }}"
            npx cdk destroy --all --force
          fi
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Verify destruction
        run: |
          echo "✅ Stack destruction completed for environment: ${{ github.event.inputs.environment }}"
          echo "📋 Remaining stacks:"
          npx cdk list || echo "No stacks remaining"
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: Notify destruction
        if: always()
        run: |
          echo "::notice::Stack destruction ${{ job.status }} for environment: ${{ github.event.inputs.environment }}"