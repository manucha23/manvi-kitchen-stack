name: Deploy Frontend

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'kitchen-frontend/package-lock.json'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: kitchen-frontend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get stack outputs
        id: stack-outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name ManviKitchenStack-test --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          USER_POOL_ID=$(aws cloudformation describe-stacks --stack-name ManviKitchenStack-test --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" --output text)
          USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks --stack-name ManviKitchenStack-test --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" --output text)
          BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name ManviKitchenStack-test --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name ManviKitchenStack-test --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          
          echo "api-url=$API_URL" >> $GITHUB_OUTPUT
          echo "user-pool-id=$USER_POOL_ID" >> $GITHUB_OUTPUT
          echo "user-pool-client-id=$USER_POOL_CLIENT_ID" >> $GITHUB_OUTPUT
          echo "bucket-name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "distribution-id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT

      - name: Build frontend
        run: |
          # Substitute variables in JavaScript template
          envsubst < src/assets/env.template.js > src/assets/env.js
          npm run build
        working-directory: kitchen-frontend
        env:
          API_URL: ${{ steps.stack-outputs.outputs.api-url }}
          USER_POOL_ID: ${{ steps.stack-outputs.outputs.user-pool-id }}
          USER_POOL_CLIENT_ID: ${{ steps.stack-outputs.outputs.user-pool-client-id }}
          REGION: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync kitchen-frontend/dist/kitchen-frontend/ s3://${{ steps.stack-outputs.outputs.bucket-name }}/ --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ steps.stack-outputs.outputs.distribution-id }} --paths "/*"