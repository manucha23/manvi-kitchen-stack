name: Build and Deploy CDK Stack

on:
  push:
    paths-ignore:
      - 'kitchen-frontend/**'
      - 'openapi-ui/**'
      - 'landing-page/**'
      - 'bin/landing-page-stack.ts'
      - 'lib/constructs/frontend/landing-page-hosting.ts'
      - 'lib/constructs/certificates/cloudfront-certificate.ts'
      - 'bin/cloudfront-certificate.ts'
  pull_request:
    branches:
      - develop
    paths-ignore:
      - 'kitchen-frontend/**'
      - 'openapi-ui/**'
      - 'landing-page/**'
      - 'bin/landing-page-stack.ts'
      - 'lib/constructs/frontend/landing-page-hosting.ts'
      - 'lib/constructs/certificates/cloudfront-certificate.ts'
      - 'bin/cloudfront-certificate.ts'

permissions:
  contents: read
  id-token: write

jobs:
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      should-deploy: ${{ steps.env.outputs.should-deploy }}
      should-upload-artifacts: ${{ steps.env.outputs.should-upload-artifacts }}
    steps:
      - id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" && "${{ github.event_name }}" == "push" ]]; then
            echo "environment=test" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "should-upload-artifacts=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" == "push" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "should-upload-artifacts=true" >> $GITHUB_OUTPUT
          else
            echo "environment=test" >> $GITHUB_OUTPUT
            echo "should-deploy=false" >> $GITHUB_OUTPUT
            echo "should-upload-artifacts=false" >> $GITHUB_OUTPUT
          fi

  build-and-test:
    needs: [determine-environment]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    strategy:
      matrix:
        node-version: ['24.x']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build TypeScript
        run: npm run build

      - name: Build Lambda functions
        run: ./build-lambdas.sh

      - name: CDK synth
        run: |
          export CDK_DEFAULT_ACCOUNT=${{ secrets.AWS_ACCOUNT_ID }}
          export CDK_DEFAULT_REGION=${{ secrets.AWS_REGION }}
          npx cdk synth -c environment=${{ needs.determine-environment.outputs.environment }}
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Upload CDK artifacts
        if: needs.determine-environment.outputs.should-upload-artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cdk-artifacts
          path: |
            cdk.out/
            lambda/*/dist/
            lambda/*/node_modules/
          retention-days: 5

  deploy:
    needs: [determine-environment, build-and-test]
    if: needs.determine-environment.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Download CDK artifacts
        uses: actions/download-artifact@v4
        with:
          name: cdk-artifacts
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Bootstrap CDK (if needed)
        run: |
          export CDK_DEFAULT_ACCOUNT=${{ secrets.AWS_ACCOUNT_ID }}
          export CDK_DEFAULT_REGION=${{ secrets.AWS_REGION }}
          npx cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ secrets.AWS_REGION }} --region ${{ secrets.AWS_REGION }}
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Inspect synthesized Lambda assets
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const template = JSON.parse(fs.readFileSync('cdk.out/ManviKitchenStack-test.template.json', 'utf8'));
          const resources = template.Resources;

          for (const [logicalId, resource] of Object.entries(resources)) {
            if (resource.Type !== 'AWS::Lambda::Function') {
              continue;
            }

            const assetPath = resource.Metadata?.['aws:asset:path'];
            const s3Key = resource.Properties?.Code?.S3Key;
            if (!assetPath || !s3Key) {
              continue;
            }

            const fullPath = path.join('cdk.out', assetPath);
            const sizeBytes = fs.existsSync(fullPath)
              ? Number(require('child_process').execFileSync('du', ['-sk', fullPath]).toString().trim().split(/\s+/)[0]) * 1024
              : null;

            console.log(JSON.stringify({
              logicalId,
              handler: resource.Properties.Handler,
              runtime: resource.Properties.Runtime,
              s3Key,
              assetPath,
              localSizeMb: sizeBytes === null ? null : Math.round((sizeBytes / 1024 / 1024) * 100) / 100,
            }));
          }
          NODE

      - name: Check Order Audit asset in bootstrap bucket
        run: |
          ORDER_AUDIT_KEY=$(node -e "const t=require('./cdk.out/ManviKitchenStack-test.template.json'); console.log(t.Resources.OrderAuditOrderAuditHandler2148F8EE.Properties.Code.S3Key)")
          echo "Order Audit S3 key: ${ORDER_AUDIT_KEY}"
          aws s3api head-object \
            --bucket cdk-hnb659fds-assets-${{ secrets.AWS_ACCOUNT_ID }}-${{ secrets.AWS_REGION }} \
            --key "${ORDER_AUDIT_KEY}" \
            || true
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Deploy CDK stack
        run: |
          export CDK_DEFAULT_ACCOUNT=${{ secrets.AWS_ACCOUNT_ID }}
          export CDK_DEFAULT_REGION=${{ secrets.AWS_REGION }}
          npx cdk deploy -c environment=${{ needs.determine-environment.outputs.environment }} --require-approval=never --app "cdk.out" --region ${{ secrets.AWS_REGION }} --verbose
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
