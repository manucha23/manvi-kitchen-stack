name: Deploy Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (e.g., v1.2.3)'
        required: true
        type: string
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - test
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validate tag format
        run: |
          if ! [[ "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag must be in format vX.Y.Z (e.g., v1.2.3)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Read config from SSM
        id: config
        run: |
          ENV=${{ inputs.environment }}
          get_param() {
            aws ssm get-parameter --name "/cravnest/${ENV}/$1" --query Parameter.Value --output text
          }
          echo "api-url=$(get_param api-url)" >> $GITHUB_OUTPUT
          echo "user-pool-id=$(get_param user-pool-id)" >> $GITHUB_OUTPUT
          echo "user-pool-client-id=$(get_param user-pool-client-id)" >> $GITHUB_OUTPUT
          echo "bucket=$(get_param frontend-bucket-name)" >> $GITHUB_OUTPUT
          echo "distribution=$(get_param frontend-distribution-id)" >> $GITHUB_OUTPUT

      - name: Build frontend
        run: |
          envsubst < src/assets/env.template.js > src/assets/env.js
          npm run build
        env:
          API_URL: ${{ steps.config.outputs.api-url }}
          USER_POOL_ID: ${{ steps.config.outputs.user-pool-id }}
          USER_POOL_CLIENT_ID: ${{ steps.config.outputs.user-pool-client-id }}
          REGION: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: aws s3 sync dist/cravnest-frontend/browser s3://${{ steps.config.outputs.bucket }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ steps.config.outputs.distribution }} \
            --paths "/*" --query 'Invalidation.Id' --output text)
          echo "Waiting for invalidation ${INVALIDATION_ID} to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ steps.config.outputs.distribution }} \
            --id ${INVALIDATION_ID}

      - name: Deployment summary
        run: |
          echo "### 🚀 Frontend release deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ inputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bucket:** ${{ steps.config.outputs.bucket }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed at:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
