name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || echo "No lint script configured"

      - name: Test
        run: npm run test -- --watch=false --browsers=ChromeHeadless || echo "Tests skipped"

      - name: Build
        run: npm run build
